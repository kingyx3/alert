name = "lazada-tcg-restock-monitor"
main = "src/dispatcher-entry.js"
compatibility_date = "2026-09-05"
workers_dev = true

# Keep Worker execution near Singapore for state/Telegram latency. Lazada source
# reads are performed by redundant GitHub-hosted Chrome runners instead.
[placement]
region = "aws:ap-southeast-1"

[triggers]
# Cloudflare Cron is minute-granularity. Each tick dispatches immediately and the
# Worker dispatches five more times at 10-second offsets for a 10-second cadence.
# Cloudflare Cron uses UTC, so 00:00-11:59 UTC maps to 08:00-19:59 SGT.
crons = ["*/1 0-11 * * *"]

[durable_objects]
bindings = [
  { name = "MONITOR", class_name = "LazadaMonitor" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LazadaMonitor"]

[vars]
EXTERNAL_SNAPSHOT_MODE = "true"
# 10-second primary cadence; five minutes without a clean accepted snapshot is degraded.
EXTERNAL_HEALTH_STALE_SECONDS = "300"
CHECK_INTERVAL_SECONDS = "10"
RECOVERY_INTERVAL_SECONDS = "300"
RECOVERY_SUCCESS_TARGET = "6"
BLOCK_BACKOFF_SECONDS = "1800"
ERROR_BACKOFF_SECONDS = "60"
MISSING_CONFIRMATIONS = "2"
TCG_KEYWORDS = "pokemon,pokémon,tcg,trading card"
# Notify immediately even when an in-stock SKU is first discovered before a baseline exists.
ALERT_ON_FIRST_RUN = "true"
# Final defense: snapshots that finish after 20:00 SGT may reconcile state but cannot send Telegram.
ALERT_WINDOW_ENFORCED = "true"
ALLOW_EMPTY_TCG_SNAPSHOT = "false"
DEBUG_NOTIFY_SUCCESS = "false"
GITHUB_DISPATCH_REPOSITORY = "kingyx3/alert"
GITHUB_DISPATCH_WORKFLOW = "lazada-playwright-probe.yml"
GITHUB_DISPATCH_REF = "main"
