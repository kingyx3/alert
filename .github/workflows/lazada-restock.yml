name: Lazada TCG Restock Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      scraping_url:
        description: 'Authorized Lazada/public product feed URL (defaults to repo variable SCRAPING_URL)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: lazada-tcg-restock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore last stock state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .state
          git fetch origin monitor-state:refs/remotes/origin/monitor-state
          git show origin/monitor-state:state/lazada_stock.json > .state/lazada_stock.json
          cp .state/lazada_stock.json /tmp/lazada_stock_before.json

      - name: Check for TCG restocks
        env:
          SCRAPING_URL: ${{ inputs.scraping_url || vars.SCRAPING_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          STOCK_STATE_PATH: .state/lazada_stock.json
          ALERT_ON_FIRST_RUN: 'false'
          TCG_KEYWORDS: ${{ vars.TCG_KEYWORDS || 'pokemon,pokémon,tcg,trading card' }}
        run: python lazada_monitor.py

      - name: Persist stock state when it changed
        shell: bash
        run: |
          set -euo pipefail
          if cmp -s /tmp/lazada_stock_before.json .state/lazada_stock.json; then
            echo 'Stock state unchanged.'
            exit 0
          fi

          cp .state/lazada_stock.json /tmp/lazada_stock_after.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C monitor-state origin/monitor-state
          mkdir -p state
          cp /tmp/lazada_stock_after.json state/lazada_stock.json
          git add state/lazada_stock.json

          if git diff --cached --quiet; then
            echo 'No state diff to commit.'
            exit 0
          fi

          git commit -m 'Update Lazada stock state [skip ci]'
          git push origin monitor-state
