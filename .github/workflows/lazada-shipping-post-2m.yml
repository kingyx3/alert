name: Lazada Shipping POST (1-minute cadence, 1-2pm SGT)

on:
  workflow_dispatch:
    inputs:
      pairs_json:
        description: Optional JSON array override of [itemId, skuId] pairs
        required: false
        type: string
      quantity:
        description: Quantity override
        required: false
        type: string
  schedule:
    # GitHub Actions has a 5-minute minimum schedule interval.
    # Trigger every 5 minutes during 13:00-13:59 SGT and run once per minute
    # inside each job to cover the intervening minutes.
    - cron: '*/5 13 * * *'
      timezone: 'Asia/Singapore'

permissions:
  contents: read

concurrency:
  group: lazada-shipping-post-1m-1pm-sgt
  cancel-in-progress: false

jobs:
  post-shipping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      # Repository variable format example:
      # [["13822368851","124830542173"],["123456789","987654321"]]
      LAZADA_ITEM_SKU_PAIRS: ${{ inputs.pairs_json || vars.LAZADA_ITEM_SKU_PAIRS || '[["13822368851","124830542173"]]' }}
      LAZADA_QUANTITY: ${{ inputs.quantity || vars.LAZADA_QUANTITY || '1' }}
      LAZADA_COOKIE: ${{ secrets.LAZADA_COOKIE }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate configuration
        run: |
          set -euo pipefail
          if [[ -z "${LAZADA_COOKIE:-}" ]]; then
            echo "Missing repository secret LAZADA_COOKIE." >&2
            exit 2
          fi
          node -e 'const v=JSON.parse(process.env.LAZADA_ITEM_SKU_PAIRS); if (!Array.isArray(v) || !v.length || !v.every(p => Array.isArray(p) && p.length === 2)) process.exit(2)'

      - name: POST all item/SKU pairs every minute during 13:00-13:59 SGT
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            sgt_hour="$(TZ=Asia/Singapore date +%H)"
            if [[ "${sgt_hour}" != "13" ]]; then
              echo "Outside 13:00-13:59 SGT; stopping this job."
              break
            fi

            echo "=== Lazada shipping POST batch ${attempt}/5 at $(TZ=Asia/Singapore date +%Y-%m-%dT%H:%M:%S%z) ==="
            node lazada-checkout-post/post-shipping.mjs

            if [[ "${attempt}" -lt 5 ]]; then
              sleep 60
            fi
          done
