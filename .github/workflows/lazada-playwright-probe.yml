name: Lazada Playwright Monitor

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Dispatch source
        required: false
        type: string
      dispatch_key:
        description: Stable batch key supplied by Cloudflare
        required: false
        type: string
      scheduled_at:
        description: Cloudflare scheduled timestamp
        required: false
        type: string
  pull_request:
    paths:
      - 'cloudflare-worker/scripts/lazada-playwright-probe.mjs'
      - 'cloudflare-worker/src/gha-entry.js'
      - 'cloudflare-worker/src/dispatcher-entry.js'
      - 'cloudflare-worker/wrangler.toml'
      - '.github/workflows/lazada-playwright-probe.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/scripts/lazada-playwright-probe.mjs'
      - 'cloudflare-worker/src/gha-entry.js'
      - 'cloudflare-worker/src/dispatcher-entry.js'
      - 'cloudflare-worker/wrangler.toml'
      - '.github/workflows/lazada-playwright-probe.yml'
  schedule:
    # Delayed fallback only. Cloudflare dispatches the primary batch at :03/:13/etc.
    # If a fresh snapshot already exists, this scheduled run exits before Chrome starts.
    - cron: '8-58/10 8-23 * * *'
      timezone: 'Asia/Singapore'

permissions:
  contents: read

concurrency:
  group: lazada-playwright-monitor-${{ github.event_name == 'workflow_dispatch' && 'cloudflare-dispatch' || github.ref }}
  cancel-in-progress: true

env:
  MONITOR_URL: https://lazada-tcg-restock-monitor.kingyx33.workers.dev

jobs:
  gate:
    name: source-gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      should_run: ${{ steps.route.outputs.should_run }}
      batch_id: ${{ steps.route.outputs.batch_id }}
    steps:
      - name: Decide whether this run should probe Lazada
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DISPATCH_KEY: ${{ inputs.dispatch_key }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          batch_id="${INPUT_DISPATCH_KEY:-}"
          if [[ -z "${batch_id}" ]]; then
            batch_id="${RUN_ID}-${RUN_ATTEMPT}"
          fi
          should_run=true

          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            body="$(curl --silent --show-error --max-time 10 "${MONITOR_URL}/healthz" || true)"
            echo "Fallback health check: ${body}"
            if HEALTH_JSON="${body}" python - <<'PY'
          import datetime, json, os, sys
          try:
              health = json.loads(os.environ.get('HEALTH_JSON') or '{}')
              last = health.get('lastSuccessAt')
              if not last:
                  raise ValueError('no lastSuccessAt')
              stamp = datetime.datetime.fromisoformat(last.replace('Z', '+00:00'))
              age = (datetime.datetime.now(datetime.timezone.utc) - stamp).total_seconds()
              fresh = (
                  health.get('externalSnapshotMode') is True
                  and health.get('sourceEngine') == 'github-actions-playwright'
                  and 0 <= age < 7 * 60
              )
              print(f"Last accepted snapshot age: {age:.1f}s; fresh={fresh}")
              sys.exit(0 if fresh else 1)
          except Exception as exc:
              print(f"Health freshness check could not confirm a recent snapshot: {exc}")
              sys.exit(1)
          PY
            then
              should_run=false
              echo "Primary Cloudflare-dispatched batch is already fresh; skipping fallback browsers."
            else
              echo "No fresh primary snapshot; running delayed GitHub fallback browsers."
            fi
          fi

          echo "should_run=${should_run}" >> "${GITHUB_OUTPUT}"
          echo "batch_id=${batch_id}" >> "${GITHUB_OUTPUT}"

      - name: Wait for external-snapshot Worker after a push
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            body="$(curl --silent --show-error --max-time 10 "${MONITOR_URL}/healthz" || true)"
            echo "Deployment gate attempt ${attempt}: ${body}"
            if grep -q '"externalSnapshotMode": true' <<<"${body}" && \
               grep -q '"sourceEngine": "github-actions-playwright"' <<<"${body}"; then
              echo "External-snapshot Worker is live."
              exit 0
            fi
            sleep 5
          done
          echo "Worker did not expose external-snapshot mode before timeout." >&2
          exit 1

  probe:
    name: primary-${{ matrix.slot }}
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use preinstalled Chrome
        run: |
          google-chrome --version
          npm install --no-save --no-package-lock playwright-core@1.58.2

      - name: Probe Lazada and submit clean snapshot
        id: probe
        continue-on-error: true
        env:
          LAZADA_URL: ${{ vars.LAZADA_URL }}
          DEBUG_TOKEN: ${{ secrets.DEBUG_TOKEN }}
          INGEST_ENABLED: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
          BATCH_ID: ${{ needs.gate.outputs.batch_id }}
          PROBE_SLOT: ${{ matrix.slot }}
          PROBE_ARTIFACT_DIR: probe-artifacts-${{ matrix.slot }}
          TCG_KEYWORDS: pokemon,pokémon,tcg,trading card
        run: node cloudflare-worker/scripts/lazada-playwright-probe.mjs

      - name: Upload primary diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lazada-primary-${{ github.run_id }}-${{ matrix.slot }}
          path: probe-artifacts-${{ matrix.slot }}/
          if-no-files-found: error
          retention-days: 3

  primary_assessment:
    name: primary-assessment
    if: always() && needs.probe.result != 'skipped'
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      need_rescue: ${{ steps.assess.outputs.need_rescue }}
    steps:
      - name: Download primary diagnostics
        uses: actions/download-artifact@v4
        with:
          pattern: lazada-primary-${{ github.run_id }}-*
          path: primary-results
          merge-multiple: false

      - name: Decide whether a rescue wave is needed
        id: assess
        env:
          REQUIRE_INGEST: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
        run: |
          python - <<'PY'
          import json, os, pathlib

          rows = [json.loads(path.read_text()) for path in pathlib.Path('primary-results').rglob('probe.json')]
          rows.sort(key=lambda row: int(row.get('runnerSlot') or 0))
          require_ingest = os.environ.get('REQUIRE_INGEST', 'true').lower() == 'true'

          for row in rows:
              print(
                  f"primary slot={row.get('runnerSlot')} result={row.get('result')} "
                  f"block={row.get('blockMarker')} products={row.get('tcgCandidates')} "
                  f"ingest={row.get('ingestOk')} duplicate={row.get('ingestDuplicate')}"
              )

          if require_ingest:
              ok = any(row.get('result') == 'success' and row.get('ingestOk') is True for row in rows)
          else:
              ok = any(row.get('result') == 'success' for row in rows)

          output = pathlib.Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a') as fh:
              fh.write(f"need_rescue={'false' if ok else 'true'}\n")
          print('Primary wave succeeded.' if ok else 'Primary wave needs rescue runners.')
          PY

  rescue:
    name: rescue-${{ matrix.slot }}
    needs: [gate, primary_assessment]
    if: needs.primary_assessment.outputs.need_rescue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use preinstalled Chrome
        run: |
          google-chrome --version
          npm install --no-save --no-package-lock playwright-core@1.58.2

      - name: Rescue probe and submit clean snapshot
        id: rescue_probe
        continue-on-error: true
        env:
          LAZADA_URL: ${{ vars.LAZADA_URL }}
          DEBUG_TOKEN: ${{ secrets.DEBUG_TOKEN }}
          INGEST_ENABLED: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
          BATCH_ID: ${{ needs.gate.outputs.batch_id }}
          PROBE_SLOT: ${{ matrix.slot }}
          PROBE_ARTIFACT_DIR: rescue-artifacts-${{ matrix.slot }}
          TCG_KEYWORDS: pokemon,pokémon,tcg,trading card
        run: node cloudflare-worker/scripts/lazada-playwright-probe.mjs

      - name: Upload rescue diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lazada-rescue-${{ github.run_id }}-${{ matrix.slot }}
          path: rescue-artifacts-${{ matrix.slot }}/
          if-no-files-found: error
          retention-days: 3

  verdict:
    name: batch-verdict
    if: always() && needs.probe.result != 'skipped'
    needs: [gate, probe, primary_assessment, rescue]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download all runner diagnostics
        uses: actions/download-artifact@v4
        with:
          pattern: lazada-*-${{ github.run_id }}-*
          path: batch-results
          merge-multiple: false

      - name: Require at least one clean runner
        env:
          REQUIRE_INGEST: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
        run: |
          python - <<'PY'
          import json, os, pathlib, sys

          rows = [json.loads(path.read_text()) for path in pathlib.Path('batch-results').rglob('probe.json')]
          rows.sort(key=lambda row: (str(row.get('batchId')), int(row.get('runnerSlot') or 0)))
          require_ingest = os.environ.get('REQUIRE_INGEST', 'true').lower() == 'true'

          print('Lazada batch results:')
          for row in rows:
              print(
                  f"slot={row.get('runnerSlot')} result={row.get('result')} "
                  f"block={row.get('blockMarker')} products={row.get('tcgCandidates')} "
                  f"ingest={row.get('ingestOk')} duplicate={row.get('ingestDuplicate')}"
              )

          if not rows:
              print('No runner diagnostics were produced.', file=sys.stderr)
              sys.exit(2)

          if require_ingest:
              ok = any(row.get('result') == 'success' and row.get('ingestOk') is True for row in rows)
          else:
              ok = any(row.get('result') == 'success' for row in rows)

          if not ok:
              print('Primary and rescue runners were all blocked or failed.', file=sys.stderr)
              sys.exit(1)

          print('Batch succeeded: at least one independent runner produced a clean snapshot.')
          PY

      - name: Verify live Worker accepted this batch
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_BATCH_ID: ${{ needs.gate.outputs.batch_id }}
        run: |
          set -euo pipefail
          body="$(curl --silent --show-error --fail --max-time 15 "${MONITOR_URL}/healthz")"
          echo "${body}"
          HEALTH_JSON="${body}" python - <<'PY'
          import json, os, sys
          health = json.loads(os.environ['HEALTH_JSON'])
          expected = os.environ['EXPECTED_BATCH_ID']
          checks = {
              'externalSnapshotMode': health.get('externalSnapshotMode') is True,
              'sourceEngine': health.get('sourceEngine') == 'github-actions-playwright',
              'lastAcceptedBatchId': health.get('lastAcceptedBatchId') == expected,
              'noBlockStreak': int(health.get('blockStreak') or 0) == 0,
          }
          print('Health verification:', checks)
          if not all(checks.values()):
              print(f"Worker health did not confirm batch {expected}", file=sys.stderr)
              sys.exit(1)
          PY
