name: Cloudflare Lazada TCG Monitor

on:
  pull_request:
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-lazada-tcg-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Worker syntax, snapshot ingestion, and Wrangler config
        run: |
          node --check src/index.js
          node --check src/entry.js
          node --check src/gha-entry.js
          node --test test/entry.test.mjs test/gha-entry.test.mjs
          npx --yes wrangler@4.129.0 deploy --dry-run --outdir dist

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker and sync runtime configuration
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          wranglerVersion: '4.129.0'
          secrets: |
            LAZADA_URL
            TELEGRAM_BOT_TOKEN
            TELEGRAM_CHANNEL_ID
            DEBUG_TOKEN
        env:
          LAZADA_URL: ${{ vars.LAZADA_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
          DEBUG_TOKEN: ${{ secrets.DEBUG_TOKEN }}

      - name: Verify external-snapshot deployment has propagated
        env:
          MONITOR_URL: ${{ steps.deploy.outputs['deployment-url'] }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            body="$(curl --silent --show-error --max-time 10 "${MONITOR_URL%/}/healthz" || true)"
            echo "Propagation check ${attempt}: ${body}"
            if grep -q '"externalSnapshotMode": true' <<<"${body}" && \
               grep -q '"sourceEngine": "github-actions-playwright"' <<<"${body}"; then
              echo "External-snapshot Worker is live; no direct Lazada fetch was performed."
              exit 0
            fi
            sleep 5
          done
          echo "New Worker version did not propagate before timeout." >&2
          exit 1
