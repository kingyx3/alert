name = "sg-collectibles-market-intel"
main = "src/index.js"
compatibility_date = "2026-09-07"
workers_dev = true

[triggers]
# Lightweight scheduler. Each source has its own due time (3m-6h+) and failure backoff.
crons = ["*/2 * * * *"]

[durable_objects]
bindings = [
  { name = "COLLECTIBLES_MONITOR", class_name = "CollectiblesMonitor" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CollectiblesMonitor"]

[vars]
USD_SGD_RATE = "1.30"
MIN_NET_MARGIN_PCT = "22"
MIN_DEMAND_SCORE = "62"
MIN_BUY_SCORE = "76"
MIN_WATCH_SCORE = "58"
SELL_PLATFORM_FEE_PCT = "4"
SELL_SHIPPING_SGD = "4.5"
SELL_RISK_BUFFER_PCT = "5"
ALERT_COOLDOWN_SECONDS = "21600"
TCG_API_HISTORY_ENABLED = "false"
MARKET_CACHE_SECONDS = "21600"
MARKET_NEGATIVE_CACHE_SECONDS = "900"
MAX_MARKET_LOOKUPS_PER_RUN = "24"
